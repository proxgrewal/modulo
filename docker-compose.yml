# Production-like stack: Postgres 16 + Modulo (media on a volume).
#   docker compose up --build        -> http://localhost:4000
# For S3-compatible media storage (AWS S3, Cloudflare R2, MinIO, Garage...), set on `app`:
#   S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
name: modulo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modulo
      POSTGRES_PASSWORD: modulo
      POSTGRES_DB: modulo
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulo"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://modulo:modulo@postgres:5432/modulo
      MODULO_DATA: /data
      MODULO_OPEN_SIGNUP: "0"
      PORT: "4000"
    volumes: [media:/data]
    ports: ["4000:4000"]

volumes:
  pgdata: {}
  media: {}
